# Render Blueprint - provisions the whole deployed app in one go.
# To use: push this repo to GitHub, then on Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and creates
# everything below; it then auto-deploys on every push to main (see README).
#
# No managed Kafka on Render - the backend runs with SPRING_PROFILES_ACTIVE=render,
# which disables the Kafka-backed event publisher/listeners in favor of an in-process
# equivalent (see backend/web/src/main/resources/application-render.yml and
# InProcessGroupBookingEventPublisher). Kafka itself stays local-only, via
# docker-compose, for development.
#
# Database is Neon (https://neon.tech), not a Render-managed Postgres: Render's free
# Postgres is deleted after 30 days, Neon's free tier isn't. DB_HOST/DB_PORT/DB_NAME/
# DB_USER below are plain values (not secret on their own); DB_PASS is sync: false -
# set it directly in the Render dashboard, never commit it.
services:
  - type: web
    name: agency-voyage-backend
    env: docker
    repo: https://github.com/rimzou12/voyage-agency.git
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/trips
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        value: ep-lively-lab-b55c1hce-pooler.c-7.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASS
        sync: false
      - key: AGENCY_VOYAGE_JWT_SECRET
        generateValue: true
      - key: AGENCY_VOYAGE_ADMIN_EMAIL
        sync: false
      - key: AGENCY_VOYAGE_ADMIN_PASSWORD
        sync: false
      - key: AGENCY_VOYAGE_CORS_ALLOWED_ORIGINS
        value: https://agency-voyage-frontend.onrender.com

  - type: web
    name: agency-voyage-frontend
    runtime: static
    repo: https://github.com/rimzou12/voyage-agency.git
    buildCommand: cd frontend && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
