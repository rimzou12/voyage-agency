spring:
  application:
    name: agency-voyage

  datasource:
    url: jdbc:postgresql://localhost:5433/agencyvoyage
    username: agencyvoyage
    password: agencyvoyage

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: agency-voyage-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.agencyvoyage.infrastructure.messaging.kafka.dto"

server:
  port: 8080

agency-voyage:
  group-booking:
    finalization-check-interval-ms: 30000
  jwt:
    # Dev-only default. Override via AGENCY_VOYAGE_JWT_SECRET in any real deployment.
    secret: ${AGENCY_VOYAGE_JWT_SECRET:dev-only-secret-key-change-me-in-production-32+bytes}
    expiration-ms: 7200000 # 2h
  admin-seed:
    # Dev-only default admin account, created on startup if it doesn't exist yet.
    # Override both in any real deployment.
    email: ${AGENCY_VOYAGE_ADMIN_EMAIL:admin@agencyvoyage.example}
    password: ${AGENCY_VOYAGE_ADMIN_PASSWORD:admin12345}
